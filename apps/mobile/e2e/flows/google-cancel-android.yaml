appId: si.tryweave
name: WEA-10 S17 Android Google browser cancellation
---
- launchApp
- assertVisible: Welcome back
- tapOn: Continue with Google
- extendedWaitUntil:
    visible:
      id: com.android.chrome:id/close_button
    timeout: 30000
- tapOn:
    id: com.android.chrome:id/close_button
- extendedWaitUntil:
    visible: Welcome back
    timeout: 30000
- assertNotVisible: Logout
- tapOn: Email code
- assertVisible: Send code
- takeScreenshot: google-cancelled
