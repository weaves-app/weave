appId: si.tryweave
name: WEA-10 S17 iOS Google browser cancellation
---
- launchApp
- assertVisible: Welcome back
- tapOn: Continue with Google
- runFlow:
    when:
      visible: '.*Wants to Use.*google.com.*'
    commands:
      - tapOn: Continue
- extendedWaitUntil:
    visible:
      id: Close
    timeout: 30000
- tapOn:
    id: Close
- extendedWaitUntil:
    visible: Welcome back
    timeout: 30000
- assertNotVisible: Logout
- tapOn: Email code
- assertVisible: Send code
- takeScreenshot: google-cancelled
