// Weave consumer build for pinned upstream API sources; no publishing/sample/UI tooling.
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'com.google.devtools.ksp'
android {
    namespace 'com.clerk.sdk'
    compileSdk 36
    defaultConfig {
        minSdk 24
        buildConfigField 'String', 'SDK_VERSION', '"1.1.11"'
        consumerProguardFiles 'consumer-rules.pro'
    }
    buildFeatures { buildConfig = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
repositories { google(); mavenCentral() }
dependencies {
    api 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.browser:browser:1.10.0'
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.clerk:automap-annotations:0.1.3'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.1'
    implementation 'com.google.android.play:integrity:1.6.0'
    implementation 'com.auth0.android:jwtdecode:2.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-datetime:0.8.0-0.6.x-compat'
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.4.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-kotlinx-serialization:3.0.0'
    compileOnly 'androidx.compose.foundation:foundation'
    ksp 'com.clerk:automap-processor:0.1.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.24.0'
}
