appId: si.tryweave
name: WEA-10 T054 landscape tablet enlarged text
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: Welcome back
    timeout: 30000
- takeScreenshot: login-password
- swipe:
    start: '75%, 80%'
    end: '75%, 35%'
- tapOn: Email code
- takeScreenshot: login-email-code
- tapOn:
    id: field-email
- inputText: preview@example.com
- hideKeyboard
- swipe:
    start: '75%, 80%'
    end: '75%, 40%'
- tapOn: Send code
- extendedWaitUntil:
    visible: Check your email
    timeout: 15000
- tapOn: Check your email
- assertVisible: preview@example.com
- assertVisible:
    id: field-verification-code
- assertVisible: Choose another method
- takeScreenshot: otp-keyboard
- tapOn:
    id: field-verification-code
- inputText: '12345'
- assertVisible: '12345'
- takeScreenshot: otp-partial
- inputText: '6'
- swipe:
    start: '75%, 80%'
    end: '75%, 40%'
- extendedWaitUntil:
    visible: That code was not accepted. Check it and try again.
    timeout: 15000
- assertVisible: Choose another method
- takeScreenshot: otp-invalid
- tapOn: Resend code
- extendedWaitUntil:
    visible: Check your email
    timeout: 15000
- assertNotVisible: That code was not accepted. Check it and try again.
- assertNotVisible: Logout
- tapOn: Choose another method
- assertVisible: Welcome back
- assertNotVisible:
    id: field-verification-code
- takeScreenshot: login-restored
