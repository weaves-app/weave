appId: si.tryweave
name: WEA-10 T049 deterministic OTP presentation
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: Welcome back
    timeout: 30000
- tapOn: Email code
- tapOn:
    id: field-email
- inputText: preview@example.com
- tapOn: Welcome back
- tapOn: Send code
- extendedWaitUntil:
    visible: Check your email
    timeout: 15000
- assertVisible: preview@example.com
- assertVisible:
    id: field-verification-code
- takeScreenshot: otp-keyboard
- tapOn:
    id: field-verification-code
- inputText: '12 34-56'
- assertVisible: '123456'
- takeScreenshot: otp-filled
- swipe:
    start: '50%, 40%'
    end: '50%, 20%'
- scrollUntilVisible:
    element: Verify code
    centerElement: true
- tapOn: Verify code
- assertVisible: Verifying code…
- takeScreenshot: otp-pending
- extendedWaitUntil:
    visible: That code was not accepted. Check it and try again.
    timeout: 15000
- takeScreenshot: otp-invalid
- tapOn: Resend code
- extendedWaitUntil:
    visible: Check your email
    timeout: 15000
- assertNotVisible: That code was not accepted. Check it and try again.
- assertNotVisible: Logout
- tapOn: Choose another method
- assertVisible: Welcome back
- assertVisible:
    id: field-password
- assertNotVisible:
    id: field-verification-code
- takeScreenshot: login-restored
