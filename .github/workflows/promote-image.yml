name: Promote one released image alias
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      environment:
        type: string
        required: true
permissions:
  contents: read
  packages: write
concurrency:
  group: promote-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download existing release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          node -e 'if(!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(process.env.VERSION))process.exit(1)'
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern release-manifest.json
      - name: Promote digest aliases without rebuilding
        env:
          VERSION: ${{ inputs.version }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: node scripts/promote-images.mjs
