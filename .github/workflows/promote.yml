name: Promote released images
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing official stable version (for example 0.1.0)
        required: true
      environment:
        type: choice
        options: [qa, production]
        required: true
permissions:
  contents: read
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/promote-image.yml # zizmor: ignore[self-repository] -- Use the reusable workflow at the same main commit as the caller.
    with:
      version: ${{ inputs.version }}
      environment: ${{ inputs.environment }}
  production:
    needs: promote
    if: github.ref == 'refs/heads/main' && inputs.environment == 'qa'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/promote-image.yml # zizmor: ignore[self-repository] -- Use the reusable workflow at the same main commit as the caller.
    with:
      version: ${{ inputs.version }}
      environment: production
